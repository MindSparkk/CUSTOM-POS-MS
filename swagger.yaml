openapi: 3.0.3
info:
  title: Retail POS Microservices API
  description: API documentation for the Retail Point of Sale (POS) backend microservices.
  version: 1.1.0
servers:
  - url: http://localhost:8081
    description: Order Service
  - url: http://localhost:8083
    description: Payment Service
  - url: http://localhost:8084
    description: Finalize Service
  - url: http://localhost:8085
    description: Telemetry Service

tags:
  - name: Order Service
    description: Endpoints for managing carts and items
  - name: Payment Service
    description: Endpoints for processing cash
  - name: Finalize Service
    description: Endpoints for finalizing orders and generating receipts
  - name: Telemetry Service
    description: Logging, ingestion, and real-time streaming endpoints

paths:
  /health:
    get:
      summary: Health Check Endpoint
      description: Returns health status of the service (Available on ports 8081, 8083, 8084, 8085).
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                    example: UP

  /orders:
    post:
      tags:
        - Order Service
      summary: Create a new order
      description: Initializes a new cart session with a unique order number and trace ID.
      servers:
        - url: http://localhost:8081
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_no:
                    type: string
                    example: ORD-10025
                  trace_id:
                    type: string
                    example: TRC-82931

  /orders/{orderNo}:
    get:
      tags:
        - Order Service
      summary: Get order details
      description: Retrieves the current state of an order including all items, subtotals, and taxes.
      servers:
        - url: http://localhost:8081
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found

  /orders/{orderNo}/items:
    post:
      tags:
        - Order Service
      summary: Add item to order
      description: Adds a product to the cart by SKU.
      servers:
        - url: http://localhost:8081
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  example: "100001"
                quantity:
                  type: integer
                  example: 2
      responses:
        '200':
          description: Item added
        '404':
          description: SKU not found

  /orders/{orderNo}/items/{sku}:
    delete:
      tags:
        - Order Service
      summary: Void item from cart
      description: Removes an item SKU from the active open order cart.
      servers:
        - url: http://localhost:8081
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Item voided from cart
        '404':
          description: Item not found in cart

  /orders/{orderNo}/calculate:
    post:
      tags:
        - Order Service
      summary: Calculate order total
      description: Computes subtotals, promotional discounts, taxes, and grand total.
      servers:
        - url: http://localhost:8081
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Calculation complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_no:
                    type: string
                  trace_id:
                    type: string
                  subtotal:
                    type: number
                  discount:
                    type: number
                  tax:
                    type: number
                  total:
                    type: number

  /payments:
    post:
      tags:
        - Payment Service
      summary: Submit cash payment
      description: Validates transaction amount against cash received and calculates change.
      servers:
        - url: http://localhost:8083
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_no:
                  type: string
                  example: ORD-10025
                trace_id:
                  type: string
                  example: TRC-82931
                amount:
                  type: number
                  example: 500.00
                cash_received:
                  type: number
                  example: 1000.00
      responses:
        '200':
          description: Payment successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_no:
                    type: string
                  trace_id:
                    type: string
                  change:
                    type: number
                  status:
                    type: string
        '400':
          description: Insufficient cash or invalid request

  /finalize:
    post:
      tags:
        - Finalize Service
      summary: Finalize transaction
      description: Verifies payment, checks stock availability, updates inventory, and marks order as COMPLETED.
      servers:
        - url: http://localhost:8084
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                order_no:
                  type: string
                  example: ORD-10025
                trace_id:
                  type: string
                  example: TRC-82931
      responses:
        '200':
          description: Order finalized successfully
        '400':
          description: Order not paid or insufficient stock

  /orders/{orderNo}/receipt:
    get:
      tags:
        - Finalize Service
      summary: Generate Receipt
      description: Generates a formatted text receipt for a COMPLETED order.
      servers:
        - url: http://localhost:8084
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_no:
                    type: string
                  receipt_text:
                    type: string

  /ingest:
    post:
      tags:
        - Telemetry Service
      summary: Ingest Telemetry Logs
      description: Central ingestion endpoint receiving structured POSLog JSON events from microservices.
      servers:
        - url: http://localhost:8085
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POSLog'
      responses:
        '202':
          description: Log ingested and persisted

  /logs:
    get:
      tags:
        - Telemetry Service
      summary: Fetch Telemetry Logs
      description: Retrieves the last 5,000 ingested logs from memory/disk buffer.
      servers:
        - url: http://localhost:8085
      responses:
        '200':
          description: Array of telemetry logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/POSLog'

  /stream:
    get:
      tags:
        - Telemetry Service
      summary: Real-Time Telemetry SSE Stream
      description: Server-Sent Events (SSE) endpoint emitting live JSON log stream to AI backend / monitoring UI.
      servers:
        - url: http://localhost:8085
      responses:
        '200':
          description: Event stream (text/event-stream)

components:
  schemas:
    Order:
      type: object
      properties:
        order_no:
          type: string
        trace_id:
          type: string
        status:
          type: string
        subtotal:
          type: number
          format: float
        discount:
          type: number
          format: float
        tax:
          type: number
          format: float
        total:
          type: number
          format: float
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
            
    OrderItem:
      type: object
      properties:
        sku:
          type: string
        name:
          type: string
        category:
          type: string
        quantity:
          type: integer
        unit_price:
          type: number
          format: float
        total:
          type: number
          format: float

    POSLog:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          example: "2026-09-22T15:30:00Z"
        trace_id:
          type: string
          example: "TRC-82931"
        order_no:
          type: string
          example: "ORD-10025"
        service:
          type: string
          example: "payment-service"
        operation:
          type: string
          example: "payment"
        level:
          type: string
          example: "ERROR"
        http_status:
          type: integer
          example: 503
        error_code:
          type: string
          example: "ERR_PAYMENT_FAILED"
        message:
          type: string
          example: "Payment gateway connection refused"
        metadata:
          type: object
