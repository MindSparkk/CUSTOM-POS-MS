openapi: 3.0.0
info:
  title: POS Microservices API
  description: Point of Sale system with distributed microservices for order, payment, and finalization
  version: 1.0.0
  contact:
    name: POS Team

servers:
  - url: http://172.28.142.25:8081
    description: Order Service
  - url: http://172.28.142.25:8083
    description: Payment Service
  - url: http://172.28.142.25:8084
    description: Finalize Service
  - url: http://172.28.142.25:8085
    description: Telemetry Service

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Orders
    description: Order management endpoints
  - name: Payments
    description: Payment processing endpoints
  - name: Finalize
    description: Order finalization endpoints
  - name: Telemetry
    description: Real-time event streaming

paths:
  # ============== HEALTH ENDPOINTS ==============
  /health:
    get:
      tags:
        - Health
      summary: Service health check
      description: Returns service status. Use to check if service is UP/DOWN
      responses:
        200:
          description: Service is UP
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: order-service
                  status:
                    type: string
                    enum: [UP, DOWN]
                  version:
                    type: string
                    example: 1.0.0
                  timestamp:
                    type: string
                    format: date-time

  /ready:
    get:
      tags:
        - Health
      summary: Service readiness check
      description: Returns readiness status including dependency health
      responses:
        200:
          description: Service is READY
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                    enum: [READY, NOT_READY]
                  timestamp:
                    type: string
                    format: date-time
                  dependencies:
                    type: object
                    properties:
                      postgresql:
                        type: string
                        enum: [UP, DOWN]
        503:
          description: Service NOT_READY
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  status:
                    type: string
                    enum: [NOT_READY]
                  dependencies:
                    type: object

  # ============== ORDER SERVICE (8081) ==============
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new order
      description: Creates a new order with status OPEN
      parameters:
        - name: X-Store-ID
          in: header
          schema:
            type: string
            default: STORE-104
        - name: X-Lane-ID
          in: header
          schema:
            type: string
            default: LANE-01
        - name: X-Lane-Type
          in: header
          schema:
            type: string
            enum: [CASHIER_EXPRESS, SELF_CHECKOUT]
            default: CASHIER_EXPRESS
        - name: X-Cashier-ID
          in: header
          schema:
            type: string
            default: CASHIER-101
      responses:
        201:
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        500:
          description: Order creation failed

  /orders/{orderNo}:
    get:
      tags:
        - Orders
      summary: Get order details
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
            example: ORD-1234567890
      responses:
        200:
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        404:
          description: Order not found

  /orders/{orderNo}/items:
    post:
      tags:
        - Orders
      summary: Add item to order
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: X-Store-ID
          in: header
          schema:
            type: string
            default: STORE-104
        - name: X-Cashier-ID
          in: header
          schema:
            type: string
            default: CASHIER-101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, quantity, price]
              properties:
                sku:
                  type: string
                  example: SKU-001
                name:
                  type: string
                  example: Ground Meat
                quantity:
                  type: integer
                  example: 2
                price:
                  type: number
                  format: double
                  example: 10.99
      responses:
        200:
          description: Item added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        400:
          description: Invalid order status or request

  /orders/{orderNo}/items/{sku}:
    delete:
      tags:
        - Orders
      summary: Remove item from order
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Item removed successfully
        404:
          description: Item or order not found

  /orders/{orderNo}/calculate:
    post:
      tags:
        - Orders
      summary: Calculate order totals
      parameters:
        - name: orderNo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                discount:
                  type: number
                  format: double
                  example: 2.50
      responses:
        200:
          description: Order calculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  # ============== PAYMENT SERVICE (8083) ==============
  /payments:
    post:
      tags:
        - Payments
      summary: Process payment
      parameters:
        - name: X-Store-ID
          in: header
          schema:
            type: string
            default: STORE-104
        - name: X-Cashier-ID
          in: header
          schema:
            type: string
            default: CASHIER-101
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no, amount, payment_method]
              properties:
                order_no:
                  type: string
                  example: ORD-1234567890
                amount:
                  type: number
                  format: double
                  example: 25.99
                payment_method:
                  type: string
                  enum: [CASH, CARD, MOBILE]
                  example: CARD
      responses:
        200:
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        400:
          description: Order not OPEN or payment failed

  # ============== FINALIZE SERVICE (8084) ==============
  /finalize:
    post:
      tags:
        - Finalize
      summary: Finalize order
      parameters:
        - name: X-Store-ID
          in: header
          schema:
            type: string
            default: STORE-104
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_no]
              properties:
                order_no:
                  type: string
                  example: ORD-1234567890
      responses:
        200:
          description: Order finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizeResponse'
        400:
          description: Order not in PAYMENT_COMPLETED status

  # ============== TELEMETRY SERVICE (8085) ==============
  /health:
    get:
      tags:
        - Health
      summary: Telemetry service health
      responses:
        200:
          description: Service UP
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                    example: telemetry-service
                  status:
                    type: string
                    example: UP

  /events:
    get:
      tags:
        - Telemetry
      summary: Stream real-time events (SSE)
      description: Server-Sent Events stream. Shows all order, payment, and finalize events in real-time
      responses:
        200:
          description: Event stream connected
          content:
            text/event-stream:
              schema:
                type: string

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        order_no:
          type: string
          example: ORD-1234567890
        trace_id:
          type: string
        store_id:
          type: string
          example: STORE-104
        lane_id:
          type: string
          example: LANE-01
        lane_type:
          type: string
          enum: [CASHIER_EXPRESS, SELF_CHECKOUT]
        cashier_id:
          type: string
          example: CASHIER-101
        status:
          type: string
          enum: [OPEN, PAYMENT_COMPLETED, FINALIZED]
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              name:
                type: string
              quantity:
                type: integer
              price:
                type: number
        subtotal:
          type: number
          format: double
        discount:
          type: number
          format: double
        tax:
          type: number
          format: double
        total:
          type: number
          format: double
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: integer
        order_no:
          type: string
        trace_id:
          type: string
        store_id:
          type: string
        amount:
          type: number
          format: double
        payment_method:
          type: string
          enum: [CASH, CARD, MOBILE]
        status:
          type: string
          enum: [SUCCESS, FAILED]
        created_at:
          type: string
          format: date-time

    FinalizeResponse:
      type: object
      properties:
        order_no:
          type: string
        status:
          type: string
          example: FINALIZED
        trace_id:
          type: string
        message:
          type: string
          example: Order finalized successfully
        timestamp:
          type: string
          format: date-time
